name = "rag-scrape-api"
main = "src/index.ts"
compatibility_date = "2024-05-29"
# linkedom relies on a handful of Node builtins — nodejs_compat provides them
# inside the Workers runtime without pulling in a full polyfill bundle.
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────────────────────
# All non-secret configuration lives in [vars] — everything below this table
# ([[kv_namespaces], [ai]) is a different TOML table, so keys placed after it
# would NOT be env vars. (This exact mistake cost us an evening — keep [vars]
# as the FIRST table and put every new var inside it.)
# ──────────────────────────────────────────────────────────────────────────────

[vars]
# The shared demo key used by `npx rag-scrape` with no --api-key flag.
# Anyone can use it, so it is hard-capped at 5 requests per IP per 30 days.
DEMO_KEY = "demo_rsk_free_tier_2024"

# The landing page is served by this same worker at "/", so checkout
# returns to it; the page reads ?key= / ?checkout= from the query string.
CHECKOUT_SUCCESS_URL = "https://rag-scrape-api.owerryking.workers.dev/?checkout=success"
CHECKOUT_CANCEL_URL = "https://rag-scrape-api.owerryking.workers.dev/?checkout=cancelled"

# ── Payment provider switch ──────────────────────────────────────────────────
# "paystack" | "lemonsqueezy" | "" (nothing configured).
# Paystack (chosen 2026-09-22): Kenya-native, M-Pesa payouts, light KYC.
# Lemon Squeezy code stays available as an alternative provider.
PAYMENT_PROVIDER = "paystack"
# Plan codes (created via the Paystack API, test mode).
PS_PLAN_STARTER = "PLN_c59t4737wkp9vym"     # KES 1,200/mo
PS_PLAN_PRO = "PLN_j271nif737eiglu"         # KES 2,500/mo
PS_PLAN_UNLIMITED = "PLN_wmbez34u3xsflgh"   # KES 6,500/mo
PS_PLAN_FOUNDING = "PLN_5irjovz3jv6ab5i"    # Pro tier at KES 1,200/mo — first 25 only

# ── Gumroad license rail (sell-now option while Paystack live is pending) ────
# Create products/memberships with license keys enabled, paste product IDs.
GUMROAD_PRODUCT_STARTER = "SET_VIA_GUMROAD"
GUMROAD_PRODUCT_PRO = "SET_VIA_GUMROAD"
GUMROAD_PRODUCT_UNLIMITED = "SET_VIA_GUMROAD"

# ── Lemon Squeezy (dormant alternative provider) ─────────────────────────────
# Secrets: LS_API_KEY, LS_WEBHOOK_SECRET (wrangler secret put …).
LS_STORE_ID = "SET_VIA_LS_API"
LS_VARIANT_ID_PRO = "SET_VIA_LS_API"
LS_VARIANT_ID_STARTER = "SET_VIA_LS_API"
LS_VARIANT_ID_UNLIMITED = "SET_VIA_LS_API"
# "true" → create test-mode checkouts (store in Test mode). Leave "" for live.
LS_TEST_MODE = ""

# Secrets — set via CLI, never commit:
#   wrangler secret put PAYSTACK_SECRET_KEY
#   wrangler secret put LS_API_KEY
#   wrangler secret put LS_WEBHOOK_SECRET

[[kv_namespaces]]
binding = "API_KEYS"
id = "0fb0f0a155734503b24f717c9190ca8d"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "2f83988970b945328c6a6d8cac711e9e"

# Workers AI — powers embed:true (bge-small-en-v1.5, 384-dim) on paid plans.
[ai]
binding = "AI"

# Weekly Gumroad license re-verification (Mondays 07:00 UTC = 10:00 Nairobi):
# downgrades keys whose subscription was refunded/revoked/cancelled.
[triggers]
crons = ["0 7 * * 1"]
